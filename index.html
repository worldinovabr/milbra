<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A3D62">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PCP Milbra">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>PCP - Milbra Artefatos Metálicos</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --cor-principal: #0A3D62;
            --cor-principal-claro: #165B94;
            --cor-principal-escuro: #072A45;
            --fundo-cinza: #F5F7FA;
            --branco: #FFFFFF;
            --texto-escuro: #2C3E50;
            --texto-claro: #718096;
            --texto: #2C3E50;
            --superficie: #FFFFFF;
            --superficie-elevada: #FFFFFF;
            --cor-em-maquina: #27AE60;
            --cor-proximo: #F39C12;
            --cor-produzido: #3498DB;
            --cor-planejado: #95A5A6;
            --borda: #E2E8F0;
            --sombra: 0 1px 2px rgba(10, 61, 98, 0.08);
            --raio: 8px;
            --largura-menu: 250px;
            --largura-menu-min: 70px;
        }

        body.tema-escuro {
            --cor-principal: #F97316;
            --cor-principal-claro: #FDBA74;
            --cor-principal-escuro: #7C2D12;
            --fundo-cinza: #0F1720;
            --branco: #FFFFFF;
            --texto-escuro: #F4F7FB;
            --texto-claro: #A9B7C7;
            --texto: #F4F7FB;
            --superficie: #16212D;
            --superficie-elevada: #1D2A38;
            --borda: #2B3A4A;
            --sombra: 0 1px 2px rgba(0, 0, 0, 0.28);
        }
        body.tema-escuro .menu-lateral {
            background: #0B1220;
        }
        body.tema-escuro .menu-item.ativo,
        body.tema-escuro .menu-item:hover {
            background: #16212D;
        }
        body.tema-escuro .cabecalho-pagina h1 {
            background: linear-gradient(135deg, #FDBA74 0%, #F97316 48%, #EA580C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--fundo-cinza);
            color: var(--texto-escuro);
            display: flex;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .menu-lateral {
            width: var(--largura-menu);
            min-width: var(--largura-menu);
            background: var(--cor-principal);
            color: var(--branco);
            padding: 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 999;
            transition: all 0.3s ease;
        }
        .menu-lateral.minimizado {
            width: var(--largura-menu-min);
            min-width: var(--largura-menu-min);
        }
        .menu-lateral.fechado { transform: translateX(-100%); }

        .cabecalho-menu {
            padding: 20px 15px;
            background: rgba(0,0,0,0.1);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            position: relative;
        }
        .logo-menu { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; white-space: nowrap; }
        .subtitulo-menu { font-size: 0.75rem; opacity: 0.8; font-weight: 400; white-space: nowrap; }
        .menu-lateral.minimizado .logo-menu,
        .menu-lateral.minimizado .subtitulo-menu { display: none; }

        .btn-minimizar {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-minimizar:hover { background: rgba(255,255,255,0.2); }
        .menu-lateral.minimizado .btn-minimizar { right: 19px; transform: rotate(180deg); }

        .menu-item {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
            border-left: 3px solid transparent;
            white-space: nowrap;
        }
        .menu-lateral.minimizado .menu-item {
            padding: 14px 10px;
            justify-content: center;
        }
        .menu-item.ativo { background: var(--cor-principal-escuro); border-left-color: var(--branco); font-weight: 600; }
        .menu-item:hover { background: var(--cor-principal-escuro); }
        .menu-item .icone { flex-shrink: 0; width: 20px; height: 20px; color: rgba(255, 255, 255, 0.72); display: inline-flex; align-items: center; justify-content: center; }
        .menu-item .icone svg { width: 18px; height: 18px; stroke-width: 1.75; }
        .icone-dashboard { color: #60A5FA; }
        .icone-config { color: #A78BFA; }
        .icone-automaticas { color: #22D3EE; }
        .icone-maq-8 { color: #34D399; }
        .icone-maq-15 { color: #FBBF24; }
        .icone-maq-25 { color: #FB923C; }
        .icone-maq-40 { color: #F87171; }
        .icone-maq-45 { color: #C084FC; }
        .icone-maq-60 { color: #F472B6; }
        .icone-solda { color: #FACC15; }
        .icone-dobra { color: #2DD4BF; }
        .icone-generico { color: #CBD5E1; }
        .menu-lateral.minimizado .menu-item span:not(.icone) { display: none; }

        .menu-rodape {
            margin-top: auto;
            padding: 15px 20px;
            font-size: 0.7rem;
            opacity: 0.7;
            border-top: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            white-space: nowrap;
        }
        .menu-lateral.minimizado .menu-rodape { display: none; }

        .btn-menu-mobile {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: var(--cor-principal);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--sombra);
            cursor: pointer;
        }

        .area-principal {
            flex: 1;
            margin-left: var(--largura-menu);
            padding: 30px 25px;
            width: 100%;
            transition: margin-left 0.3s ease;
        }
        .menu-lateral.minimizado ~ .area-principal {
            margin-left: var(--largura-menu-min);
        }

        .cabecalho-pagina {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--borda);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
        }
        .cabecalho-pagina h1 { font-size: 2rem; font-weight: 700; color: var(--cor-principal); margin-bottom: 5px; }
        .cabecalho-pagina p { color: var(--texto-claro); font-size: 1rem; }
        .toggle-tema {
            width: 76px;
            height: 38px;
            padding: 3px;
            border-radius: 999px;
            border: 1px solid var(--borda);
            background: var(--superficie-elevada);
            color: var(--texto-escuro);
            box-shadow: var(--sombra);
            justify-content: space-between;
            position: relative;
            flex-shrink: 0;
        }
        .toggle-tema::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            left: 4px;
            top: 3px;
            border-radius: 50%;
            background: var(--cor-principal);
            transition: transform 0.25s ease;
            z-index: 0;
        }
        body.tema-escuro .toggle-tema::before { transform: translateX(36px); }
        .toggle-tema span {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            font-size: 1rem;
        }

        .legenda-status { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.9rem; margin-bottom: 20px; }
        .legenda-item { 
            --legenda-cor: var(--cor-principal);
            --legenda-gradiente: linear-gradient(135deg, var(--cor-principal), var(--cor-principal-escuro));
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            border-radius: 999px; cursor: pointer; transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            border: 1px solid var(--borda);
            background: var(--superficie-elevada);
            color: var(--texto);
            box-shadow: none;
            font-weight: 400;
            user-select: none;
        }
        .legenda-item.em-maquina { --legenda-cor: var(--cor-em-maquina); --legenda-gradiente: linear-gradient(135deg, #2ecc71, #1e8449); }
        .legenda-item.proximo { --legenda-cor: var(--cor-proximo); --legenda-gradiente: linear-gradient(135deg, #f6b93b, #d68910); }
        .legenda-item.produzido { --legenda-cor: var(--cor-produzido); --legenda-gradiente: linear-gradient(135deg, #5dade2, #2471a3); }
        .legenda-item.planejado { --legenda-cor: var(--cor-planejado); --legenda-gradiente: linear-gradient(135deg, #b2bec3, #636e72); }
        .legenda-item:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, var(--legenda-cor) 45%, transparent);
        }
        .legenda-item.ativo { 
            background: var(--legenda-gradiente);
            border-color: transparent;
            color: var(--branco);
        }
        .legenda-item.ativo:hover { transform: translateY(-2px) scale(1.02); }
        .bolinha { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--legenda-cor) 18%, transparent); }
        .bolinha.em-maquina { background: var(--cor-em-maquina); }
        .bolinha.proximo { background: var(--cor-proximo); }
        .bolinha.produzido { background: var(--cor-produzido); }
        .bolinha.planejado { background: var(--cor-planejado); }
        .legenda-item.ativo .bolinha { background: var(--branco); box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.22); }

        /* ÁREA DO GRÁFICO - COMPACTA E RESPONSIVA */
        .area-grafico-maquinas {
            background:
                linear-gradient(180deg, rgba(10, 61, 98, 0.94), rgba(7, 42, 69, 0.98)),
                radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.08), transparent 38%);
            padding: 18px 16px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(7, 42, 69, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            max-width: 100%;
        }
        .area-grafico-maquinas::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.05), transparent 32%, rgba(255, 255, 255, 0.04)),
                radial-gradient(circle at 88% 18%, rgba(255,255,255,0.09) 0%, transparent 36%);
            pointer-events: none;
        }
        .area-grafico-maquinas h3 {
            color: var(--branco);
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #graficoMaquinas {
            width: 100% !important;
            height: 220px !important;
            max-height: 240px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.18));
        }

        .painel-controles {
            background: var(--superficie);
            padding: 18px;
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            border: 1px solid var(--borda);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .campo-filtro { display: flex; flex-direction: column; gap: 7px; min-width: 170px; flex: 1; }
        .campo-filtro label { font-size: 0.8rem; font-weight: 600; color: var(--texto-claro); }
        input, select, textarea {
            padding: 12px 14px;
            border: 1px solid var(--borda);
            border-radius: var(--raio);
            font-size: 0.9rem;
            line-height: 1.35;
            background: var(--superficie-elevada);
            color: var(--texto-escuro);
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--cor-principal);
            box-shadow: 0 0 0 3px rgba(10, 61, 98, 0.1);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: var(--raio);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primario { background: var(--cor-principal); color: var(--branco); }
        .btn-primario:hover { background: var(--cor-principal-escuro); }
        .btn-sucesso { background: var(--cor-em-maquina); color: var(--branco); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: none; }
        .btn-sucesso:hover { background: #219653; border-color: rgba(255, 255, 255, 0.28); }
        .btn-perigo { background: #E74C3C; color: var(--branco); }
        .btn-perigo:hover { background: #C0392B; }
        .btn-pequeno { padding: 6px 10px; font-size: 0.8rem; }

        /* Cores de fundo para o select de status */
        .select-status.em-maquina {
            background-color: rgba(39, 174, 96, 0.2);
            color: #1e8449;
            font-weight: 600;
        }
        .select-status.proximo {
            background-color: rgba(243, 156, 18, 0.2);
            color: #d68910;
            font-weight: 600;
        }
        .select-status.produzido {
            background-color: rgba(52, 152, 219, 0.2);
            color: #2471a3;
            font-weight: 600;
        }
        .select-status.planejado {
            background-color: rgba(149, 165, 166, 0.2);
            color: #707b7c;
            font-weight: 600;
        }

        /* Botão de situação da máquina */
        .btn-situacao {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 4px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: transform 0.2s;
        }
        .btn-situacao:hover {
            transform: scale(1.15);
            animation-play-state: paused;
        }
        .situacao-trabalhando {
            background: #27AE60;
            color: white;
            animation: pulso-trabalhando 1.8s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.55);
        }
        .situacao-manutencao {
            background: #E74C3C;
            color: white;
            animation: pulso-manutencao 0.8s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.65);
        }
        .situacao-sem-operador {
            background: #F39C12;
            color: white;
            animation: pulso-sem-operador 1.1s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.6);
        }
        .situacao-falta-componente {
            background: #8E44AD;
            color: white;
            animation: pulso-falta-componente 0.95s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(142, 68, 173, 0.65);
        }

        @keyframes pulso-trabalhando {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.55);
            }
            70% {
                transform: scale(1.08);
                box-shadow: 0 0 0 9px rgba(39, 174, 96, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(39, 174, 96, 0);
            }
        }
        @keyframes pulso-sem-operador {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.6); }
            55% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(243, 156, 18, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(243, 156, 18, 0); }
        }
        @keyframes pulso-falta-componente {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 68, 173, 0.65); }
            45% { transform: scale(1.12); box-shadow: 0 0 0 9px rgba(142, 68, 173, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 68, 173, 0); }
        }
        @keyframes pulso-manutencao {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.65); }
            40% { transform: scale(1.14); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* Ajuste dos botões de ação */
        .btn-acao {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 50%;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 3px;
        }
        .btn-editar {
            background: #334155;
            color: #FFFFFF;
        }
        .btn-editar:hover {
            background: #1E293B;
        }

        .fundo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            padding: 15px;
        }
        .fundo-modal.aberto { display: flex; }
        .modal {
            background: var(--superficie);
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            border-top: 4px solid var(--cor-principal);
        }
        .modal-situacao {
            max-width: 430px;
        }
        .lista-situacoes-modal {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }
        .opcao-situacao {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--borda);
            border-radius: 8px;
            background: var(--superficie-elevada);
            color: var(--texto-escuro);
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .opcao-situacao:hover {
            border-color: var(--cor-principal);
            background: color-mix(in srgb, var(--cor-principal) 12%, var(--superficie-elevada));
            transform: translateY(-1px);
        }
        .opcao-situacao.ativo {
            border-color: var(--cor-principal);
            background: color-mix(in srgb, var(--cor-principal) 18%, var(--superficie-elevada));
        }
        .opcao-situacao-icone {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
        }
        .opcao-situacao strong {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
        }
        .opcao-situacao small {
            display: block;
            margin-top: 2px;
            color: var(--texto-claro);
            font-size: 0.78rem;
            font-weight: 400;
        }
        .opcao-situacao.trabalhando .opcao-situacao-icone { background: #27AE60; }
        .opcao-situacao.manutencao .opcao-situacao-icone { background: #E74C3C; }
        .opcao-situacao.sem-operador .opcao-situacao-icone { background: #F39C12; }
        .opcao-situacao.falta-componente .opcao-situacao-icone { background: #8E44AD; }
        .cabecalho-modal {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--borda);
        }
        .cabecalho-modal h3 { font-size: 1.2rem; color: var(--cor-principal); }
        .btn-fechar { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--texto-claro); padding: 0; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        .btn-fechar:hover { color: var(--texto-escuro); }

        .destaque-grupo { background: rgba(10, 61, 98, 0.05); padding: 12px; border-radius: var(--raio); margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; color: var(--cor-principal); }
        .grupo-campos-modal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .campo-modal { display: flex; flex-direction: column; gap: 5px; }
        .campo-modal.linha-cheia { grid-column: 1 / -1; }
        .campo-modal label { font-size: 0.8rem; font-weight: 600; }
        .botoes-modal { display: flex; gap: 12px; justify-content: flex-end; margin-top: 25px; flex-wrap: wrap; }

    <script>
        let graficoMaquinas = null;

        function abrirFecharMenu() { 
            const menu = document.getElementById('menu-lateral');
            menu.classList.toggle('aberto');
            menu.classList.toggle('fechado');
        }

        function alternarMinimizarMenu() {
            const menu = document.getElementById('menu-lateral');
            menu.classList.toggle('minimizado');
            localStorage.setItem('menuMinimizado', menu.classList.contains('minimizado'));
        }

        function obterTemaInicial() {
            const temaSalvo = localStorage.getItem('temaInterface');
            if (temaSalvo === 'claro' || temaSalvo === 'escuro') return temaSalvo;
            return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }

        function aplicarTema(tema) {
            const escuro = tema === 'escuro';
            document.body.classList.toggle('tema-escuro', escuro);
            document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', escuro ? '#0F1720' : '#0A3D62');

            const toggle = document.getElementById('toggle-tema');
            if (toggle) {
                toggle.setAttribute('aria-pressed', String(escuro));
                toggle.title = escuro ? 'Alternar para modo claro' : 'Alternar para modo escuro';
                toggle.setAttribute('aria-label', toggle.title);
            }
        }

        function alternarTema() {
            const proximoTema = document.body.classList.contains('tema-escuro') ? 'claro' : 'escuro';
            localStorage.setItem('temaInterface', proximoTema);
            aplicarTema(proximoTema);
            if (graficoMaquinas) atualizarGraficoMaquinas();
        }

        function filtrarPorLegenda(statusClicado) {
            const selectFiltro = document.getElementById('filtro-status');
            const itensLegenda = document.querySelectorAll('.legenda-item');
            
            if (selectFiltro.value === statusClicado) {
                selectFiltro.value = '';
                itensLegenda.forEach(i => i.classList.remove('ativo'));
            } else {
                selectFiltro.value = statusClicado;
                itensLegenda.forEach(i => i.classList.remove('ativo'));
                event.currentTarget.classList.add('ativo');
            }
            aplicarFiltros();
        }

        const ICONES_LUCIDE = {
            layoutDashboard: '<rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect>',
            settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle>',
            cpu: '<rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path>',
            wrench: '<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18a2.1 2.1 0 0 0 3 3l6.7-6.7a4 4 0 0 0 5-5l-2.6 2.6-2.4-2.4 2-3.2z"></path>',
            zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46L12 10h8a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46L12 14z"></path>',
            foldHorizontal: '<path d="M2 12h6"></path><path d="M16 12h6"></path><path d="M12 2v2"></path><path d="M12 8v2"></path><path d="M12 14v2"></path><path d="M12 20v2"></path><path d="m19 15 3-3-3-3"></path><path d="m5 9-3 3 3 3"></path>'
        };

        function iconeLucide(nome) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES_LUCIDE[nome] || ICONES_LUCIDE.wrench}</svg>`;
        }

        const ICONES_GRUPOS = {

            "Máquinas de 8": iconeLucide('wrench'),

        const CLASSES_ICONES_GRUPOS = {
            "AUTOMÁTICAS": "icone-automaticas",
            "Máquinas de 8": "icone-maq-8",
            "Máquinas de 15": "icone-maq-15",
            "Máquinas de 25": "icone-maq-25",

        const SITUACOES_MAQUINA = [

            { valor: 'falta-componente', titulo: 'Falta de componente', detalhe: 'Aguardando material', icone: '🧩', classe: 'falta-componente' }

        const GRUPOS_PADRAO = { 
            "AUTOMÁTICAS": ["MC-01","MC-01","M-01", "M-02", "M-03", "M-04", "M-05", "M-06"],
            "Máquinas de 8": ["8.4", "8.7", "8.9", "8.10", "8.11", "8.12", "8.13", "8.14", "8.15"],

        };

        const FIREBASE_SDK_URL = 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
        const FIRESTORE_SDK_URL = 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
        const ANALYTICS_SDK_URL = 'https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js';
        let firestore;
        let firebaseApi;

        async function inicializarBanco() {
            const [{ initializeApp }, firestoreModulo] = await Promise.all([
                import(FIREBASE_SDK_URL),
                import(FIRESTORE_SDK_URL)
            ]);

            firebaseApi = firestoreModulo;

            const resposta = await fetch('./firebase-config.json', { cache: 'no-store' });
            if (!resposta.ok) throw new Error('NÃ£o foi possÃ­vel carregar firebase-config.json');

            const firebaseConfig = await resposta.json();
            const app = initializeApp(firebaseConfig);
            firestore = firebaseApi.getFirestore(app);

            if (firebaseConfig.measurementId && location.protocol === 'https:') {
                import(ANALYTICS_SDK_URL)
                    .then(({ getAnalytics }) => getAnalytics(app))
                    .catch(() => {});
            }

            await carregarGruposPadrao();
        }

        function docId(valor) {
            return encodeURIComponent(String(valor));
        }

        function colecao(nome) {
            return firebaseApi.collection(firestore, nome);
        }

        function documento(nomeColecao, id) {
            return firebaseApi.doc(firestore, nomeColecao, docId(id));
        }

        async function carregarGruposPadrao() {
            await Promise.all(Object.entries(GRUPOS_PADRAO).map(async ([nome, maqs]) => {
                const ref = documento('grupos', nome);
                const existente = await firebaseApi.getDoc(ref);
                if (!existente.exists()) {
                    await firebaseApi.setDoc(ref, { nome, maquinas: maqs });
                }
            }));
        }

        function atualizarGraficoMaquinas() {
            let dados = [...PROGRAMACOES];
            
            if (abaAtual !== 'todas') {
                dados = dados.filter(p => p.grupo === abaAtual);
            }
            const filtroCod = document.getElementById('filtro-codigo').value.toLowerCase();
            const filtroStatus = document.getElementById('filtro-status').value;
            const filtroData = document.getElementById('filtro-data').value;
            const filtroMaq = document.getElementById('filtro-maquina').value;

            if (filtroCod) {
                dados = dados.filter(p => 
                    (p.codigo || '').toLowerCase().includes(filtroCod) || 
                    (p.nome || '').toLowerCase().includes(filtroCod)
                );
            }
            if (filtroStatus) {
                dados = dados.filter(p => p.status === filtroStatus);
            }
            if (filtroData) {
                dados = dados.filter(p => p.dataEntrega === filtroData);
            }
            if (filtroMaq) {
                dados = dados.filter(p => p.maquina === filtroMaq);
            }

            const contagemPorMaq = {};
            dados.forEach(p => {
                if (!contagemPorMaq[p.maquina]) {
                    contagemPorMaq[p.maquina] = { total: 0, executada: 0, status: {}, codigos: new Set(), subprodutos: new Set() };
                }
                const qtdPedida = Number(p.qtdPedida) || 1;
                const qtdExecutada = Math.max(0, Number(p.qtdExecutada) || 0);
                contagemPorMaq[p.maquina].total += qtdPedida;
                contagemPorMaq[p.maquina].executada += qtdExecutada;
                contagemPorMaq[p.maquina].status[p.status] = (contagemPorMaq[p.maquina].status[p.status] || 0) + qtdPedida;
                if (p.codigo) contagemPorMaq[p.maquina].codigos.add(p.codigo);
                if (p.codigoSubproduto) contagemPorMaq[p.maquina].subprodutos.add(p.codigoSubproduto);
            });

            const maquinas = Object.keys(contagemPorMaq).sort();
            const ctx = document.getElementById('graficoMaquinas').getContext('2d');
            
            if (graficoMaquinas) graficoMaquinas.destroy();

            let corBase = 'rgba(255, 80, 50, 0.9)';
            if (filtroStatus) corBase = CORES_STATUS[filtroStatus];
            const corExecutada = 'rgba(30, 136, 229, 0.95)';
            const coresRestantes = maquinas.map(m => {
                if (!filtroStatus) {
                    const sts = contagemPorMaq[m].status;
                    if (sts['Em máquina']) return CORES_STATUS['Em máquina'];
                    if (sts['Próximo']) return CORES_STATUS['Próximo'];
                    if (sts['Produzido']) return CORES_STATUS['Produzido'];
                    return CORES_STATUS['Planejado'];
                }
                return corBase;
            });
            const dadosExecutados = maquinas.map(m => Math.min(contagemPorMaq[m].executada, contagemPorMaq[m].total));
            const dadosRestantes = maquinas.map(m => Math.max(contagemPorMaq[m].total - contagemPorMaq[m].executada, 0));
            const maiorTotalGrafico = Math.max(...maquinas.map(m => contagemPorMaq[m].total), 0);
            const ajustarOpacidade = (cor, opacidade) => {
                if (!cor || typeof cor !== 'string') return cor;
                if (cor.startsWith('rgba(')) return cor.replace(/,\s*[\d.]+\)$/, `, ${opacidade})`);
                if (cor.startsWith('rgb(')) return cor.replace('rgb(', 'rgba(').replace(')', `, ${opacidade})`);
                return cor;
            };
            const criarGradienteBarra = (chart, cor) => {
                const { ctx, chartArea } = chart;
                if (!chartArea) return cor;
                const gradiente = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                gradiente.addColorStop(0, ajustarOpacidade(cor, 0.96));
                gradiente.addColorStop(1, ajustarOpacidade(cor, 0.72));
                return gradiente;
            };
            const gradienteBarraPlugin = {
                id: 'gradienteBarra',
                beforeDatasetsDraw(chart) {
                    chart.data.datasets[0].backgroundColor = criarGradienteBarra(chart, corExecutada);
                    chart.data.datasets[1].backgroundColor = coresRestantes.map(cor => criarGradienteBarra(chart, cor));
                }
            };
            const rotulosBarraPlugin = {
                id: 'rotulosBarra',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                    ctx.shadowBlur = 4;
                    ctx.font = '700 11px Inter, Segoe UI, Arial, sans-serif';

                    chart.data.datasets.forEach((dataset, datasetIndex) => {
                        const meta = chart.getDatasetMeta(datasetIndex);
                        meta.data.forEach((bar, index) => {
                            const valor = Number(dataset.data[index]) || 0;
                            const altura = Math.abs(bar.base - bar.y);
                            const y = (bar.y + bar.base) / 2;
                            if (!valor || !Number.isFinite(y)) return;

                            if (datasetIndex === 1) {
                                ctx.textBaseline = 'bottom';
                                ctx.fillText(String(Math.round(valor)), bar.x, Math.max(12, bar.y - 6));
                                return;
                            }

                            if (altura < 16) {
                                ctx.textBaseline = 'bottom';
                                ctx.fillText(String(Math.round(valor)), bar.x, Math.max(12, bar.base - 4));
                                return;
                            }

                            ctx.textBaseline = 'middle';
                            ctx.fillText(String(Math.round(valor)), bar.x, y);
                        });
                    });
                    ctx.restore();
                }
            };

            graficoMaquinas = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: maquinas,
                    datasets: [
                        {
                            label: 'Qtd Executada',
                            data: dadosExecutados,
                            backgroundColor: corExecutada,
                            borderColor: 'rgba(255, 255, 255, 0.32)',
                            borderWidth: 1.2,
                            borderRadius: { bottomLeft: 5, bottomRight: 5 },
                            hoverBorderColor: 'rgba(255, 255, 255, 0.58)',
                            barPercentage: 0.7,
                            categoryPercentage: 0.8,
                            stack: 'volume'
                        },
                        {
                            label: 'Qtd Restante',
                            data: dadosRestantes,
                            backgroundColor: coresRestantes,
                            borderColor: 'rgba(255, 255, 255, 0.28)',
                            borderWidth: 1.2,
                            borderRadius: { topLeft: 5, topRight: 5 },
                            hoverBorderColor: 'rgba(255, 255, 255, 0.58)',
                            barPercentage: 0.7,
                            categoryPercentage: 0.8,
                            stack: 'volume'
                        }
                    ]
                },
                plugins: [gradienteBarraPlugin, rotulosBarraPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 22, right: 12, bottom: 4, left: 4 }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(7, 22, 38, 0.94)',
                            titleColor: '#fff',
                            bodyColor: 'rgba(255,255,255,0.88)',
                            padding: 10,
                            borderRadius: 8,
                            borderColor: 'rgba(255,255,255,0.14)',
                            borderWidth: 1,
                            displayColors: false,
                            titleFont: { family: 'Inter', size: 11, weight: '600' },
                            bodyFont: { family: 'Inter', size: 10, weight: '400' },
                            callbacks: {
                                label: function(ctx) {
                                    const maq = maquinas[ctx.dataIndex];
                                    const info = contagemPorMaq[maq];
                                    const codigos = [...info.codigos];
                                    const subprodutos = [...info.subprodutos];
                                    const linhas = [];
                                    if (codigos.length === 1) {
                                        linhas.push(`Código item: ${codigos[0]}`);
                                    }
                                    if (codigos.length > 1) {
                                        linhas.push(`Códigos itens: ${codigos.join(', ')}`);
                                    }
                                    if (subprodutos.length === 1) {
                                        linhas.push(`Subproduto: ${subprodutos[0]}`);
                                    }
                                    if (subprodutos.length > 1) {
                                        linhas.push(`Subprodutos: ${subprodutos.join(', ')}`);
                                    }
                                    linhas.push(`Total: ${info.total}`);
                                    linhas.push(`Executado: ${info.executada}`);
                                    linhas.push(`Restante: ${Math.max(info.total - info.executada, 0)}`);
                                    Object.entries(info.status).forEach(([s, q]) => linhas.push(`${s}: ${q}`));
                                    return linhas;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false },
                            border: { display: false },
                            ticks: { 
                                color: 'rgba(255,255,255,0.72)', 
                                font: { family: 'Inter', size: 9, weight: '600' },
                                maxRotation: 45,
                                minRotation: 0
                            }
                        },
                        y: {
                            stacked: true,
                            border: { display: false },
                            grid: { color: 'rgba(255,255,255,0.09)', lineWidth: 1, drawTicks: false },
                            ticks: { 
                                color: 'rgba(255,255,255,0.72)', 
                                font: { family: 'Inter', size: 9, weight: '400' },
                                padding: 8,
                                maxTicksLimit: 5
                            },
                            beginAtZero: true,
                            suggestedMax: maiorTotalGrafico * 1.12
                        }
                    }
                }
            });
        }

            renderizarConfig();

            delete ABAS_GRUPOS[nome];

            renderizarConfig();

            const nome = prompt("Nome da máquina:");
            if (!nome) return;
            ABAS_GRUPOS[grupo].push(nome);
            await salvarGrupo(grupo, ABAS_GRUPOS[grupo]);
            atualizarSelectMaquinas();
            renderizarConfig();

            if (!novo) return alert("Nome inválido!");
            ABAS_GRUPOS[grupo][idx] = novo;
            await salvarGrupo(grupo, ABAS_GRUPOS[grupo]);
            atualizarSelectMaquinas();
        }

        function buscarConflitoEmMaquina(maquina, idIgnorado = null) {
            const maquinaNormalizada = String(maquina || '').trim().toLowerCase();
            if (!maquinaNormalizada) return null;

            return PROGRAMACOES.find(p =>
                p.id !== idIgnorado &&
                p.status === 'Em máquina' &&
                String(p.maquina || '').trim().toLowerCase() === maquinaNormalizada
            );
        }

        function alertarConflitoEmMaquina(maquina, conflito) {
            const item = conflito.nome || conflito.codigo || 'item sem nome';
            const op = conflito.op ? `\nOP: ${conflito.op}` : '';
            alert(`Não é possível colocar outro item em máquina.\n\nA máquina ${maquina} já está rodando:\n${item}${op}\n\nFinalize ou altere o status desse item antes de programar outro.`);
        }

        async function removerMaq(grupo, idx) {
            if (!confirm("Remover máquina?")) return;
            ABAS_GRUPOS[grupo].splice(idx,1);
            await salvarGrupo(grupo, ABAS_GRUPOS[grupo]);
            atualizarSelectMaquinas();
        }

            if (!cod) return;

            const item = BANCO_ITENS.find(i => String(i.codigo).trim() === cod);

        async function salvarProgramacao() {
            try {
            const cod = document.getElementById('codigo-item').value.trim();
            const codSubproduto = document.getElementById('codigo-subproduto').value.trim();
            const nome = document.getElementById('nome-item').value.trim();
            const cli = document.getElementById('cliente-item').value.trim();
            const op = document.getElementById('op-programacao').value.trim();
            let maq = document.getElementById('maquina-programacao').value.trim();
            const dt = document.getElementById('data-entrega').value;
            const qtd = document.getElementById('qtd-pedida').value;

            if (!nome || !cli || !maq || !dt || !qtd) return alert("Preencha todos os campos obrigatórios!");
            if (!cod) return alert("Informe o código do item!");
            const statusProgramacao = document.getElementById('status-inicial').value || 'Planejado';

            let grupo = Object.entries(ABAS_GRUPOS).find(([g, m]) => m.includes(maq))?.[0];
            if (!grupo) {
                grupo = abaAtual !== 'todas' ? abaAtual : "Máquinas de 8";
                if (!ABAS_GRUPOS[grupo]) ABAS_GRUPOS[grupo] = [];
                ABAS_GRUPOS[grupo].push(maq);
                await salvarGrupo(grupo, ABAS_GRUPOS[grupo]);
                atualizarSelectMaquinas();
                atualizarMenuAbas();
            }

            if (statusProgramacao === 'Em máquina') {
                const conflito = buscarConflitoEmMaquina(maq, idEdicaoAtual);
                if (conflito) return alertarConflitoEmMaquina(maq, conflito);
            }

            if (idEdicaoAtual) {
                const prog = PROGRAMACOES.find(item => item.id === idEdicaoAtual);
                prog.codigo = cod;
                prog.codigoSubproduto = codSubproduto;
                prog.nome = nome;
                prog.cliente = cli;
                prog.op = op;
                prog.maquina = maq;
                prog.grupo = grupo;
                prog.dataEntrega = dt;
                prog.qtdPedida = Number(qtd);
                prog.status = statusProgramacao;
                prog.observacao = document.getElementById('observacao-item').value.trim();
                
                await salvarProg(prog);
            } else {
                const prog = {
                    id: Date.now(),
                    codigo: cod,
                    codigoSubproduto: codSubproduto,
                    nome: nome,
                    cliente: cli,
                    op: op,
                    maquina: maq,
                    grupo: grupo,
                    dataEntrega: dt,
                    qtdPedida: Number(qtd),
                    status: statusProgramacao,
                    observacao: document.getElementById('observacao-item').value.trim(),
                    situacaoMaquina: 'trabalhando' // Valor padrão
                };
                await salvarProg(prog);
            }

            const itemExistente = BANCO_ITENS.find(item => String(item.codigo).trim() === cod);
            if (!itemExistente) {
                await salvarItem({ codigo: cod, nome: nome, cliente: cli });
                BANCO_ITENS.push({ codigo: cod, nome: nome, cliente: cli });
            } else {
                if (itemExistente.nome !== nome || itemExistente.cliente !== cli) {
                    itemExistente.nome = nome;
                    itemExistente.cliente = cli;
                    await salvarItem(itemExistente);
                }
            }

            PROGRAMACOES = await buscarProgs();
            fecharModalProgramacao();
            atualizarGraficoMaquinas();
            carregarTabela();
            alert(idEdicaoAtual ? "✅ Atualizado com sucesso!" : "✅ Cadastrado com sucesso!");
            } catch (erro) {
                console.error('Erro ao salvar no Firebase:', erro);
                alert(`NÃ£o foi possÃ­vel salvar no Firebase.\n\n${erro.code || ''} ${erro.message || erro}`);
            }
        }

        async function alterarStatus(id, novo) {
            const p = PROGRAMACOES.find(i => i.id === id);
            if (!p) return;
            if (novo === 'Em máquina') {
                const conflito = buscarConflitoEmMaquina(p.maquina, id);
                if (conflito) {
                    alertarConflitoEmMaquina(p.maquina, conflito);
                    carregarTabela();
                    return;
                }
            }
            p.status = novo;
            await salvarProg(p);
            atualizarGraficoMaquinas();
            carregarTabela();
        }

        async function alterarQtdExecutada(id, valor) {
            const p = PROGRAMACOES.find(i => i.id === id);
            if (!p) return;

            const quantidade = Number(valor);
            p.qtdExecutada = valor === '' || Number.isNaN(quantidade) ? 0 : quantidade;
            await salvarProg(p);
            atualizarGraficoMaquinas();
            carregarTabela();
        }

        function alterarSituacaoMaq(id) {
            const p = PROGRAMACOES.find(i => i.id === id);
            if (!p) return;

            idSituacaoAtual = id;
            const lista = document.getElementById('lista-situacoes-modal');
            const situacaoAtual = p.situacaoMaquina || 'trabalhando';

            lista.innerHTML = SITUACOES_MAQUINA.map(s => `
                <button class="opcao-situacao ${s.classe} ${situacaoAtual === s.valor ? 'ativo' : ''}" onclick="selecionarSituacaoMaq('${s.valor}')">
                    <span class="opcao-situacao-icone">${s.icone}</span>
                    <span>
                        <strong>${s.titulo}</strong>
                        <small>${s.detalhe}</small>
                    </span>
                </button>
            `).join('');

            document.getElementById('modal-situacao').classList.add('aberto');
        }

        function fecharModalSituacao() {
            document.getElementById('modal-situacao').classList.remove('aberto');
            idSituacaoAtual = null;
        }

        async function selecionarSituacaoMaq(valor) {
            const p = PROGRAMACOES.find(i => i.id === idSituacaoAtual);
            if (!p) return fecharModalSituacao();

            p.situacaoMaquina = valor;
            await salvarProg(p);
            fecharModalSituacao();
            carregarTabela();
        }

        // Função de exclusão com confirmação reforçada
        async function excluirItem(id) {
            const confirmacao = confirm("⚠️ ATENÇÃO!\n\nTem certeza que deseja excluir esta programação?\nEssa ação NÃO poderá ser desfeita!");
            if (!confirmacao) return;
            
            await excluirProg(id);
            PROGRAMACOES = await buscarProgs();
            atualizarGraficoMaquinas();
            carregarTabela();
        }

        function aplicarFiltros() {
            atualizarGraficoMaquinas();
            carregarTabela();
        }

        function carregarTabela() {
            let dados = [...PROGRAMACOES];
            if (abaAtual !== 'todas') {
                dados = dados.filter(p => p.grupo === abaAtual);
            }

            const filtroCod = document.getElementById('filtro-codigo').value.toLowerCase();
            const filtroStatus = document.getElementById('filtro-status').value;
            const filtroData = document.getElementById('filtro-data').value;
            const filtroMaq = document.getElementById('filtro-maquina').value;

            if (filtroCod) {
                dados = dados.filter(p => 
                    (p.codigo || '').toLowerCase().includes(filtroCod) || 
                    (p.nome || '').toLowerCase().includes(filtroCod)
                );
            }
            if (filtroStatus) {
                dados = dados.filter(p => p.status === filtroStatus);
            }
            if (filtroData) {
                dados = dados.filter(p => p.dataEntrega === filtroData);
            }
            if (filtroMaq) {
                dados = dados.filter(p => p.maquina === filtroMaq);
            }

            dados.sort((a, b) => ORDEM_STATUS[a.status] - ORDEM_STATUS[b.status]);

            const container = document.getElementById('conteudo-tabela');

            if (dados.length === 0) {
                container.innerHTML = `<div class="sem-dados">Nenhuma programação encontrada. Comece inserindo novos itens!</div>`;
                return;
            }

            container.innerHTML = `
                <table class="tabela-producao">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Código</th>
                            <th>Subproduto</th>
                            <th>OP</th>
                            <th>Item</th>
                            <th>Cliente</th>
                            <th>Máquina</th>
                            <th>Entrega</th>
                            <th>Qtd</th>
                            <th>Qtd Executada</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${dados.map(p => {
                            const classeStatus = (p.status || 'Planejado').replace(' ', '-').toLowerCase();
                            const situacao = p.situacaoMaquina || 'trabalhando';
                            let classeSituacao = 'situacao-trabalhando';
                            let iconeSituacao = '⚡';
                            let textoSituacao = '🟢 Máquina trabalhando';
                            
                            if (situacao === 'manutencao') {
                                classeSituacao = 'situacao-manutencao';
                                iconeSituacao = '🔧';
                                textoSituacao = '🔴 Parada para manutenção';
                            }
                            if (situacao === 'sem-operador') {
                                classeSituacao = 'situacao-sem-operador';
                                iconeSituacao = '👤';
                                textoSituacao = '🟠 Falta de operador';
                            }
                            if (situacao === 'falta-componente') {
                                classeSituacao = 'situacao-falta-componente';
                                iconeSituacao = '🧩';
                                textoSituacao = '🟣 Falta de componente';
                            }

                            return `
                            <tr class="linha-${classeStatus}">
                                <td>
                                    <select class="select-status ${classeStatus}" onchange="alterarStatus(${p.id}, this.value)">
                                        <option value="Planejado" ${(p.status || 'Planejado') === 'Planejado' ? 'selected' : ''}>Planejado</option>
                                        <option value="Próximo" ${(p.status || 'Planejado') === 'Próximo' ? 'selected' : ''}>Próximo</option>
                                        <option value="Em máquina" ${(p.status || 'Planejado') === 'Em máquina' ? 'selected' : ''}>Em máquina</option>
                                        <option value="Produzido" ${(p.status || 'Planejado') === 'Produzido' ? 'selected' : ''}>Produzido</option>
                                    </select>
                                </td>
                                <td>${p.codigo || '-'}</td>
                                <td>${p.codigoSubproduto || '-'}</td>
                                <td>${p.op || '-'}</td>
                                <td>${p.nome || '-'}</td>
                                <td>${p.cliente || '-'}</td>
                                <td>${p.maquina || '-'}</td>
                                <td>${p.dataEntrega ? new Date(p.dataEntrega).toLocaleDateString('pt-BR') : '-'}</td>
                                <td>${p.qtdPedida || 0}</td>
                                <td>
                                    <input
                                        class="input-qtd-executada"
                                        type="number"
                                        min="0"
                                        value="${p.qtdExecutada || ''}"
                                        placeholder="0"
                                        onchange="alterarQtdExecutada(${p.id}, this.value)"
                                    >
                                </td>
                                <td>
                                    <button class="btn-editar btn-acao" onclick="editarProgramacao(${p.id})" title="Editar programação">✏️</button>
                                    <button class="btn-perigo btn-acao" onclick="excluirItem(${p.id})" title="Excluir programação">🗑️</button>
                                    <button class="btn-situacao ${classeSituacao}" onclick="alterarSituacaoMaq(${p.id})" title="${textoSituacao}">${iconeSituacao}</button>
                                </td>
                            </tr>
                        `}).join('')}
                    </tbody>
                </table>
            `;
        }

        async function excluirItem(id) {
            const confirmacao = confirm("⚠️ ATENÇÃO!\n\nTem certeza que deseja excluir esta programação?\nEssa ação NÃO poderá ser desfeita!");
            if (!confirmacao) return;
            
            await excluirProg(id);
            PROGRAMACOES = await buscarProgs();
            atualizarGraficoMaquinas();
            carregarTabela();
        }

        async function exportarBackupCompleto() {
            const dados = {
                dataExportacao: new Date().toLocaleString('pt-BR'),
                grupos: ABAS_GRUPOS,
                itens: BANCO_ITENS,
                programacoes: PROGRAMACOES
            };

            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-pcp-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert("✅ Backup exportado com sucesso! Guarde esse arquivo em local seguro.");
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        document.addEventListener('DOMContentLoaded', iniciarSistema);
    </script>
</body>
</html>
